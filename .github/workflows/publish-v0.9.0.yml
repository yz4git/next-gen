name: Publish v0.9.0

on:
  push:
    branches:
      - ops/publish-v0.9.0
    paths:
      - ".github/workflows/publish-v0.9.0.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4292fc2846c7d3b43516ef730128d5ed25aebf44
          fetch-depth: 0

      - name: Verify release target
        run: |
          test "$(git rev-parse HEAD)" = "4292fc2846c7d3b43516ef730128d5ed25aebf44"
          node -e 'const p=require("./package.json"); if(p.version!=="0.9.0") process.exit(1)'

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.9.0 >/dev/null 2>&1; then
            echo "v0.9.0 already exists"
            exit 0
          fi
          gh release create v0.9.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target 4292fc2846c7d3b43516ef730128d5ed25aebf44 \
            --title "WorldSeed v0.9.0 — Interoperable City Export" \
            --notes-file RELEASE_NOTES_v0.9.0.md

      - name: Build reusable release assets
        run: |
          mkdir -p release-assets
          zip -r release-assets/worldseed-schemas-v1.zip schemas/v1 docs/SCHEMA_VERSIONING.md
          zip -r release-assets/worldseed-export-consumer-v0.9.0.zip examples/export-consumer

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v0.9.0 \
            release-assets/worldseed-schemas-v1.zip \
            release-assets/worldseed-export-consumer-v0.9.0.zip \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Verify release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.9.0 --repo "$GITHUB_REPOSITORY" --json tagName,name,isDraft,isPrerelease,targetCommitish,url,assets
