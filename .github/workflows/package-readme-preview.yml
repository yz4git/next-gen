name: Package README preview candidates

on:
  push:
    branches:
      - docs/tokyo-readme-preview-20260921
    paths:
      - ".github/workflows/package-readme-preview.yml"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/tokyo-readme-preview-20260921
      - uses: actions/upload-artifact@v4
        with:
          name: worldseed-readme-preview-candidates
          path: visual-audit/readme-preview
          if-no-files-found: error
